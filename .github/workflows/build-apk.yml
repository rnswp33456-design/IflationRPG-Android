name: Build Pokemon Survivor APK

on:
  workflow_dispatch:
  push:
    branches: [ "pokemon-survivor" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore game HTML
        run: |
          rm -rf app/src/main/assets
          mkdir -p app/src/main/assets
          cat game/chunk_* | base64 -d > app/src/main/assets/index.html
          test -s app/src/main/assets/index.html
          grep -q "포켓몬 서바이버" app/src/main/assets/index.html

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK"
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose --print-certs "$APK"
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging "$APK" | head -n 20

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Pokemon-Survivor-v0.6
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
