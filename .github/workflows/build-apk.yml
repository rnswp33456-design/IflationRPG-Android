name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Android wrapper
        uses: actions/checkout@v4

      - name: Fetch InflationRPG source
        run: git clone --depth 1 https://github.com/GoodStudyDay/IflationRPG.git /tmp/IflationRPG

      - name: Apply Korean localization patch
        run: python3 scripts/korean_patch.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build localized web game
        working-directory: /tmp/IflationRPG
        run: |
          npm ci
          npm run build

      - name: Force Korean for existing saves
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/IflationRPG/dist/index.html')
          s=p.read_text(encoding='utf-8')
          js="""<script>
          try {
            const k='inflation-rpg-savedata';
            const raw=localStorage.getItem(k);
            const d=raw ? JSON.parse(raw) : {};
            d.language='ko';
            localStorage.setItem(k, JSON.stringify(d));
          } catch(e) {}
          </script>"""
          s=s.replace('<head>', '<head>'+js, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Package web build into Android assets
        run: |
          rm -rf app/src/main/assets
          mkdir -p app/src/main/assets
          cp -R /tmp/IflationRPG/dist/. app/src/main/assets/

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IflationRPG-Korean-Portrait
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
