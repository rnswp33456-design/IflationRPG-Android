name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Android wrapper
        uses: actions/checkout@v4

      - name: Fetch InflationRPG web build
        run: |
          git clone --depth 1 https://github.com/GoodStudyDay/IflationRPG.git /tmp/IflationRPG
          mkdir -p app/src/main/assets/game
          cp -R /tmp/IflationRPG/docs/. app/src/main/assets/game/

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IflationRPG-Android-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
