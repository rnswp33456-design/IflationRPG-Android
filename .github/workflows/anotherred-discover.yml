name: AnotherRed Discover

on:
  push:
    paths:
      - '.github/workflows/anotherred-discover.yml'
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch official site assets
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/ar
          cd /tmp/ar
          curl -L --fail --retry 3 -A 'Mozilla/5.0' https://pokemon.jhcloud.kr/ -o index.html
          curl -L --fail --retry 3 -A 'Mozilla/5.0' https://pokemon.jhcloud.kr/app.js -o app.js
          echo '=== APP.JS HEAD ==='
          sed -n '1,260p' app.js
          echo '=== APP.JS DOWNLOAD-LIKE LINES ==='
          grep -Ein 'download|7z|zip|rar|drive|fetch|api|href|location' app.js || true
          echo '=== INDEX ==='
          sed -n '1,180p' index.html

      - name: Upload discovery files
        uses: actions/upload-artifact@v4
        with:
          name: anotherred-discovery
          path: /tmp/ar
          if-no-files-found: warn
