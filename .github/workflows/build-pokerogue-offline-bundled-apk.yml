name: Build and smoke-test PokeRogue Offline MOD APK

on:
  push:
    branches: [chatgpt-pokerogue-mobile-apk]
  workflow_dispatch:

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout mod build files
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK tools
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Enable KVM hardware acceleration
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          ls -l /dev/kvm || true

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.33.2 --activate

      - name: Clone offline builder and official game source
        shell: bash
        run: |
          git clone --depth 1 https://github.com/VdustR/pokerogue-offline.git builder
          git clone --depth 1 --branch main --recurse-submodules https://github.com/pagefaultgames/pokerogue.git upstream

      - name: Install builder dependencies
        run: pnpm --dir builder install --frozen-lockfile

      - name: Apply offline wrapper patch
        run: bash builder/scripts/apply-overlay.sh upstream

      - name: Apply requested gameplay mods
        run: python3 pokerogue-mobile-build/apply-user-mods.py upstream

      - name: Restore requested classic Pokemon sprite set
        shell: bash
        run: |
          LEGACY_COMMIT=7d86634bbb25a27af613db1d9bbe75494d0cfe2e
          git -C upstream fetch --depth 1 origin "$LEGACY_COMMIT"
          rm -rf legacy-assets
          mkdir -p legacy-assets
          git -C upstream archive "$LEGACY_COMMIT" public/images/pokemon | tar -x -C legacy-assets
          test -d legacy-assets/public/images/pokemon
          mkdir -p upstream/public/images/pokemon
          rsync -a legacy-assets/public/images/pokemon/ upstream/public/images/pokemon/
          if [ -d upstream/assets/images/pokemon ]; then
            rsync -a legacy-assets/public/images/pokemon/ upstream/assets/images/pokemon/
          fi
          echo "Legacy sprite files: $(find legacy-assets/public/images/pokemon -type f | wc -l)"

      - name: Install official game dependencies
        run: pnpm --dir upstream install --frozen-lockfile

      - name: Typecheck requested source patches
        shell: bash
        run: |
          pnpm --dir upstream exec tsc --noEmit --pretty false || {
            echo 'TypeScript typecheck failed'; exit 1;
          }

      - name: Build normal offline game payload
        run: |
          pnpm --dir upstream build:offline
          mkdir -p builds/normal
          cp -a upstream/dist/. builds/normal/

      - name: Build unlock-all payload required by Android staging
        run: |
          rm -rf upstream/dist
          pnpm --dir upstream build:offline:unlock-all
          mkdir -p builds/unlock-all
          cp -a upstream/dist/. builds/unlock-all/

      - name: Stage complete game into Android app
        run: pnpm --dir builder stage:android ../builds/normal ../builds/unlock-all

      - name: Use a fresh package id to avoid signature/update conflicts
        shell: bash
        run: |
          GRADLE=builder/android/app/build.gradle.kts
          grep -n 'applicationId' "$GRADLE"
          sed -i 's/applicationId = "dev.vdustr.pokerogue.offline"/applicationId = "dev.chatgpt.pokerogue.offline.mod"/' "$GRADLE"
          grep -q 'applicationId = "dev.chatgpt.pokerogue.offline.mod"' "$GRADLE"

      - name: Build Android normal debug APK with Gradle
        working-directory: builder/android
        run: ./gradlew clean assembleNormalDebug --stacktrace

      - name: Verify APK structure alignment and signatures
        shell: bash
        run: |
          APK=$(find builder/android -path '*outputs/apk/normal/debug/*.apk' | head -n1)
          test -n "$APK"
          cp "$APK" PokeRogue-Offline-OneFile-FINAL-TESTED.apk
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          ZIPALIGN="$ANDROID_HOME/build-tools/36.0.0/zipalign"
          "$AAPT" dump badging PokeRogue-Offline-OneFile-FINAL-TESTED.apk | tee badging.txt
          "$AAPT" dump permissions PokeRogue-Offline-OneFile-FINAL-TESTED.apk | tee permissions.txt
          "$APKSIGNER" verify --verbose --print-certs PokeRogue-Offline-OneFile-FINAL-TESTED.apk | tee signature.txt
          "$ZIPALIGN" -c -P 16 -v 4 PokeRogue-Offline-OneFile-FINAL-TESTED.apk | tail -n 5
          unzip -t PokeRogue-Offline-OneFile-FINAL-TESTED.apk | tail -n 3
          unzip -l PokeRogue-Offline-OneFile-FINAL-TESTED.apk | tee apk-files.txt
          grep -q 'assets/www/index.html' apk-files.txt
          grep -q 'assets/www/offline-build.json' apk-files.txt
          grep -q 'dev.chatgpt.pokerogue.offline.mod' badging.txt
          sha256sum PokeRogue-Offline-OneFile-FINAL-TESTED.apk | tee SHA256SUMS.txt

      - name: Actual Android emulator install and launch smoke test
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 900
          disk-size: 8192M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -euxo pipefail
            APK="$GITHUB_WORKSPACE/PokeRogue-Offline-OneFile-FINAL-TESTED.apk"
            AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
            adb install -r -t "$APK" | tee "$GITHUB_WORKSPACE/adb-install.txt"
            grep -q 'Success' "$GITHUB_WORKSPACE/adb-install.txt"
            PKG=$($AAPT dump badging "$APK" | sed -n "s/package: name='\([^']*\)'.*/\1/p")
            ACT=$($AAPT dump badging "$APK" | sed -n "s/launchable-activity: name='\([^']*\)'.*/\1/p")
            test -n "$PKG"
            test -n "$ACT"
            echo "PACKAGE=$PKG" | tee "$GITHUB_WORKSPACE/runtime.txt"
            echo "ACTIVITY=$ACT" | tee -a "$GITHUB_WORKSPACE/runtime.txt"
            adb shell am force-stop "$PKG"
            adb shell am start -W -n "$PKG/$ACT" | tee "$GITHUB_WORKSPACE/adb-launch.txt"
            sleep 20
            adb shell pidof "$PKG" | tee "$GITHUB_WORKSPACE/app-pid.txt"
            test -s "$GITHUB_WORKSPACE/app-pid.txt"
            adb shell dumpsys activity activities | grep -m1 "$PKG" | tee -a "$GITHUB_WORKSPACE/runtime.txt"
            adb exec-out screencap -p > "$GITHUB_WORKSPACE/emulator-screen.png"
            adb logcat -d > "$GITHUB_WORKSPACE/logcat.txt"
            if grep -A8 -B2 'FATAL EXCEPTION' "$GITHUB_WORKSPACE/logcat.txt" | grep -q "$PKG"; then
              echo 'App fatal exception detected' >&2
              exit 1
            fi
            echo 'ANDROID_INSTALL_AND_LAUNCH_OK' | tee -a "$GITHUB_WORKSPACE/runtime.txt"

      - name: Upload tested single APK and proof
        uses: actions/upload-artifact@v4
        with:
          name: PokeRogue-Offline-OneFile-FINAL-TESTED
          compression-level: 0
          path: |
            PokeRogue-Offline-OneFile-FINAL-TESTED.apk
            SHA256SUMS.txt
            badging.txt
            permissions.txt
            signature.txt
            adb-install.txt
            adb-launch.txt
            runtime.txt
            emulator-screen.png
          if-no-files-found: error
