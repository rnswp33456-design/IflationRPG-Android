name: Build PokeRogue Cost1 APK

on:
  push:
    branches:
      - build-pokerogue-cost1-apk
    paths:
      - 'pokerogue-cost1/**'
      - '.github/workflows/build-pokerogue-cost1.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pokerogue-cost1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare artifact
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/PokeRogue-Cost1-Online.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PokeRogue-Cost1-Online
          path: pokerogue-cost1/dist/PokeRogue-Cost1-Online.apk
          if-no-files-found: error
